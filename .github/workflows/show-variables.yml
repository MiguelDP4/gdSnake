name: PR Workflow

on:
  pull_request:
    types: [opened]

jobs:
  run-on-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show Environment Variable
        run: echo "Environment variable - $MY_ENV_VAR"
      
      - name: Show Secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: echo "Secret variable - $MY_SECRET"
